name: Actualizar Propiedades Diario

on:
  schedule:
    # Corre todos los días a las 11:00 UTC (08:00 AM de Argentina)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si querés

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar scraping de propiedades
        run: python buscador.py

      - name: Subir cambios a GitHub (Excel y JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add propiedades.json Reporte_Oportunidades_InmoData.xlsx
          # Solo hacer commit si hubo cambios en los archivos
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-actualización diaria de propiedades y Excel"
          git push origin main
